# Builds and publishes a SNAPSHOT to Maven Central on every push to master.
name: Snapshot

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']

# Never cancel a deploy that is already publishing.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

# ./mvnw pins Maven 3.9.x (.mvn/wrapper): Maven 3.10 restricts where server credentials
# are sent (repositoryOrigins), which makes the Central uploads fail with 401.
env:
  MAVEN_ARGS: -B -V --no-transfer-progress

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and deploy snapshot
        run: ./mvnw $MAVEN_ARGS -Pgpg -Dmaven.javadoc.skip=true deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
